<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720" role="img" aria-labelledby="title desc">
  <title id="title">电商助手项目简化流程图</title>
  <desc id="desc">从输入商单需求和参考视频，到视频处理、AI拆解仿写、结果确认、质检交付、写入飞书的六步流程。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-20%" width="130%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#233142" flood-opacity="0.12"/>
    </filter>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#496171"/>
    </marker>
    <style>
      .title { font: 700 34px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #17212b; }
      .subtitle { font: 400 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #607282; }
      .step-title { font: 700 22px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #17212b; }
      .step-desc { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #526676; }
      .number { font: 700 18px Arial, sans-serif; fill: #ffffff; }
      .note-title { font: 700 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #17212b; }
      .note { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #526676; }
      .card { fill: #ffffff; stroke: #dce6ee; stroke-width: 1.5; rx: 8; filter: url(#shadow); }
      .pill { fill: #1677ff; }
      .arrow { stroke: #496171; stroke-width: 3; fill: none; marker-end: url(#arrow); }
    </style>
  </defs>

  <rect width="1280" height="720" fill="url(#bg)"/>

  <text x="72" y="78" class="title">电商助手项目简化流程</text>
  <text x="72" y="112" class="subtitle">一句话：输入参考视频和商单 Brief，系统拆解风格并生成可交付的短视频脚本，最后写入飞书。</text>

  <g transform="translate(72 170)">
    <rect class="card" x="0" y="0" width="320" height="138"/>
    <circle class="pill" cx="42" cy="42" r="18"/>
    <text x="42" y="48" text-anchor="middle" class="number">1</text>
    <text x="78" y="43" class="step-title">输入需求</text>
    <text x="32" y="82" class="step-desc">填写小红书视频链接</text>
    <text x="32" y="108" class="step-desc">填写品牌、产品、卖点、限制</text>
  </g>

  <path class="arrow" d="M402 239 H478"/>

  <g transform="translate(488 170)">
    <rect class="card" x="0" y="0" width="320" height="138"/>
    <circle class="pill" cx="42" cy="42" r="18"/>
    <text x="42" y="48" text-anchor="middle" class="number">2</text>
    <text x="78" y="43" class="step-title">处理素材</text>
    <text x="32" y="82" class="step-desc">下载视频、提取封面和关键帧</text>
    <text x="32" y="108" class="step-desc">可选：口播转写、字幕 OCR</text>
  </g>

  <path class="arrow" d="M818 239 H894"/>

  <g transform="translate(904 170)">
    <rect class="card" x="0" y="0" width="320" height="138"/>
    <circle class="pill" cx="42" cy="42" r="18"/>
    <text x="42" y="48" text-anchor="middle" class="number">3</text>
    <text x="78" y="43" class="step-title">AI 拆解仿写</text>
    <text x="32" y="82" class="step-desc">分析主题、卖点、文案、镜头</text>
    <text x="32" y="108" class="step-desc">生成新商单脚本和分镜</text>
  </g>

  <path class="arrow" d="M1064 320 V386"/>

  <g transform="translate(904 398)">
    <rect class="card" x="0" y="0" width="320" height="138"/>
    <circle class="pill" cx="42" cy="42" r="18"/>
    <text x="42" y="48" text-anchor="middle" class="number">4</text>
    <text x="78" y="43" class="step-title">结果页确认</text>
    <text x="32" y="82" class="step-desc">查看拆解结果、脚本和分镜</text>
    <text x="32" y="108" class="step-desc">不满意可一键重试分析</text>
  </g>

  <path class="arrow" d="M894 467 H818"/>

  <g transform="translate(488 398)">
    <rect class="card" x="0" y="0" width="320" height="138"/>
    <circle class="pill" cx="42" cy="42" r="18"/>
    <text x="42" y="48" text-anchor="middle" class="number">5</text>
    <text x="78" y="43" class="step-title">质检交付</text>
    <text x="32" y="82" class="step-desc">检查减肥、医疗、绝对化表达</text>
    <text x="32" y="108" class="step-desc">生成 delivery.md 交付稿</text>
  </g>

  <path class="arrow" d="M478 467 H402"/>

  <g transform="translate(72 398)">
    <rect class="card" x="0" y="0" width="320" height="138"/>
    <circle class="pill" cx="42" cy="42" r="18"/>
    <text x="42" y="48" text-anchor="middle" class="number">6</text>
    <text x="78" y="43" class="step-title">写入飞书</text>
    <text x="32" y="82" class="step-desc">创建飞书文档并写入内容</text>
    <text x="32" y="108" class="step-desc">返回 document_id 和访问地址</text>
  </g>

  <g transform="translate(72 610)">
    <rect x="0" y="0" width="1152" height="60" rx="8" fill="#e7f2ff" stroke="#c8def7"/>
    <text x="24" y="25" class="note-title">主要文件对应关系</text>
    <text x="24" y="48" class="note">index.html 负责页面操作；server.py 负责接口调度；scripts/analyze_video.py 负责分析生成；scripts/run_workflow.py 和 feishu/write_doc.py 负责交付写入。</text>
  </g>
</svg>
