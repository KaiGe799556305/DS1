<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120" role="img" aria-labelledby="title desc">
  <title id="title">电商助手项目详细流程图</title>
  <desc id="desc">以横向阶段方式展示电商助手从输入任务、服务调度、素材处理、AI生成、结果确认到交付飞书的流程。</desc>
  <defs>
    <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto">
      <path d="M2,2 L10,6 L2,10 Z" fill="#34495a"/>
    </marker>
    <filter id="shadow" x="-12%" y="-14%" width="124%" height="135%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#203040" flood-opacity="0.12"/>
    </filter>
    <style>
      .bg { fill: #f6f8fb; }
      .title { font: 700 38px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #122334; }
      .subtitle { font: 400 18px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #607184; }
      .section-title { font: 700 22px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #132638; }
      .stage-title { font: 700 21px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #132638; }
      .stage-sub { font: 600 14px Consolas, "Microsoft YaHei", monospace; fill: #436075; }
      .body { font: 400 15px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #4d6274; }
      .small { font: 400 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #5e7181; }
      .label { font: 700 13px "Microsoft YaHei", "PingFang SC", Arial, sans-serif; fill: #ffffff; }
      .card { fill: #ffffff; stroke: #d9e4ec; stroke-width: 1.4; rx: 10; filter: url(#shadow); }
      .output { fill: #fffaf0; stroke: #e4c36f; stroke-width: 1.4; rx: 10; filter: url(#shadow); }
      .delivery { fill: #f4fff7; stroke: #98d2ab; stroke-width: 1.4; rx: 10; filter: url(#shadow); }
      .decision { fill: #eef7ff; stroke: #9cc8f1; stroke-width: 1.4; filter: url(#shadow); }
      .band { fill: #ffffff; stroke: #dce5ed; stroke-width: 1.2; rx: 12; }
      .note { fill: #edf4fa; stroke: #d1dce5; stroke-width: 1.2; rx: 9; }
      .arrow { stroke: #34495a; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .arrow-soft { stroke: #8092a0; stroke-width: 2.2; stroke-dasharray: 8 7; fill: none; marker-end: url(#arrow); }
      .badge-blue { fill: #1677ff; }
      .badge-green { fill: #10a66e; }
      .badge-gold { fill: #c07a00; }
      .badge-gray { fill: #607184; }
    </style>
  </defs>

  <rect class="bg" width="1600" height="1120"/>

  <text x="70" y="72" class="title">电商助手项目详细流程图</text>
  <text x="70" y="106" class="subtitle">按阶段梳理：网页提交任务，后端调度脚本，处理视频素材，AI 生成脚本分镜，人工确认后交付飞书。</text>

  <g transform="translate(60 145)">
    <rect class="band" width="1480" height="420"/>
    <text x="24" y="38" class="section-title">主流程</text>
    <text x="24" y="65" class="small">从左到右是一次完整任务的正常路径，底部只保留关键产物，减少交叉线。</text>
  </g>

  <g transform="translate(92 235)">
    <rect class="card" width="205" height="205"/>
    <circle class="badge-blue" cx="34" cy="34" r="17"/>
    <text x="34" y="39" text-anchor="middle" class="label">1</text>
    <text x="62" y="39" class="stage-title">网页输入</text>
    <text x="24" y="76" class="stage-sub">index.html</text>
    <text x="24" y="112" class="body">打开 /analyze</text>
    <text x="24" y="140" class="body">填写视频链接</text>
    <text x="24" y="168" class="body">填写商单 Brief</text>
  </g>

  <g transform="translate(342 235)">
    <rect class="card" width="205" height="205"/>
    <circle class="badge-blue" cx="34" cy="34" r="17"/>
    <text x="34" y="39" text-anchor="middle" class="label">2</text>
    <text x="62" y="39" class="stage-title">服务调度</text>
    <text x="24" y="76" class="stage-sub">server.py</text>
    <text x="24" y="112" class="body">POST /api/analyze</text>
    <text x="24" y="140" class="body">创建任务 ID</text>
    <text x="24" y="168" class="body">写入 status.json</text>
  </g>

  <g transform="translate(592 235)">
    <rect class="card" width="205" height="205"/>
    <circle class="badge-green" cx="34" cy="34" r="17"/>
    <text x="34" y="39" text-anchor="middle" class="label">3</text>
    <text x="62" y="39" class="stage-title">素材处理</text>
    <text x="24" y="76" class="stage-sub">video_pipeline.py</text>
    <text x="24" y="112" class="body">下载视频</text>
    <text x="24" y="140" class="body">抽封面和关键帧</text>
    <text x="24" y="168" class="body">转写 / OCR 可选</text>
  </g>

  <g transform="translate(842 235)">
    <rect class="card" width="205" height="205"/>
    <circle class="badge-green" cx="34" cy="34" r="17"/>
    <text x="34" y="39" text-anchor="middle" class="label">4</text>
    <text x="62" y="39" class="stage-title">AI 生成</text>
    <text x="24" y="76" class="stage-sub">analyze_video.py</text>
    <text x="24" y="112" class="body">AI/启发式选帧</text>
    <text x="24" y="140" class="body">拆解主题和文案</text>
    <text x="24" y="168" class="body">生成脚本和分镜</text>
  </g>

  <g transform="translate(1092 235)">
    <rect class="output" width="205" height="205"/>
    <circle class="badge-gold" cx="34" cy="34" r="17"/>
    <text x="34" y="39" text-anchor="middle" class="label">5</text>
    <text x="62" y="39" class="stage-title">保存结果</text>
    <text x="24" y="76" class="stage-sub">results/&lt;id&gt;</text>
    <text x="24" y="112" class="body">analysis.json</text>
    <text x="24" y="140" class="body">frames / cover</text>
    <text x="24" y="168" class="body">contact_sheet.jpg</text>
  </g>

  <g transform="translate(1342 235)">
    <rect class="card" width="165" height="205"/>
    <circle class="badge-blue" cx="34" cy="34" r="17"/>
    <text x="34" y="39" text-anchor="middle" class="label">6</text>
    <text x="62" y="39" class="stage-title">结果页</text>
    <text x="24" y="76" class="stage-sub">/analyze/&lt;id&gt;</text>
    <text x="24" y="112" class="body">查看拆解</text>
    <text x="24" y="140" class="body">查看脚本</text>
    <text x="24" y="168" class="body">查看分镜</text>
  </g>

  <path class="arrow" d="M297 337 H332"/>
  <path class="arrow" d="M547 337 H582"/>
  <path class="arrow" d="M797 337 H832"/>
  <path class="arrow" d="M1047 337 H1082"/>
  <path class="arrow" d="M1297 337 H1332"/>

  <g transform="translate(165 470)">
    <rect class="output" width="295" height="60"/>
    <text x="20" y="25" class="stage-sub">status.json</text>
    <text x="20" y="46" class="small">任务运行中、页面可读进度</text>
  </g>
  <g transform="translate(535 470)">
    <rect class="output" width="330" height="60"/>
    <text x="20" y="25" class="stage-sub">references/frames/analysis.json</text>
    <text x="20" y="46" class="small">临时素材清单：帧、封面、转写、OCR</text>
  </g>
  <g transform="translate(940 470)">
    <rect class="output" width="330" height="60"/>
    <text x="20" y="25" class="stage-sub">results/&lt;id&gt;/analysis.json</text>
    <text x="20" y="46" class="small">最终分析、仿写脚本、分镜和风险信息</text>
  </g>

  <path class="arrow-soft" d="M445 440 V460"/>
  <path class="arrow-soft" d="M695 440 V460"/>
  <path class="arrow-soft" d="M1195 440 V460"/>

  <g transform="translate(60 620)">
    <rect class="band" width="1480" height="355"/>
    <text x="24" y="38" class="section-title">确认、重试与交付</text>
    <text x="24" y="66" class="small">结果页之后只有两个方向：不满意就重试 AI，满意就生成交付稿并写入飞书。</text>
  </g>

  <path class="arrow" d="M1425 440 V590 H245 V700"/>
  <text x="1160" y="582" class="small">结果页查看后进入人工确认</text>

  <g transform="translate(130 715)">
    <polygon class="decision" points="115,0 230,72 115,144 0,72"/>
    <text x="115" y="64" text-anchor="middle" class="stage-title">结果是否满意？</text>
    <text x="115" y="92" text-anchor="middle" class="body">人工判断</text>
  </g>

  <g transform="translate(445 675)">
    <rect class="card" width="290" height="112"/>
    <circle class="badge-gray" cx="32" cy="32" r="16"/>
    <text x="32" y="37" text-anchor="middle" class="label">R</text>
    <text x="60" y="37" class="stage-title">不满意：重试</text>
    <text x="24" y="72" class="stage-sub">POST /api/retry-analysis</text>
    <text x="24" y="96" class="body">保留素材，只重跑 AI 分析/仿写</text>
  </g>

  <path class="arrow-soft" d="M360 760 H435"/>
  <text x="376" y="744" class="small">不满意</text>
  <path class="arrow-soft" d="M735 731 H1488 V455"/>
  <text x="1328" y="713" class="small">重试后回到结果页</text>

  <g transform="translate(445 845)">
    <rect class="delivery" width="290" height="112"/>
    <circle class="badge-green" cx="32" cy="32" r="16"/>
    <text x="32" y="37" text-anchor="middle" class="label">A</text>
    <text x="60" y="37" class="stage-title">满意：交付</text>
    <text x="24" y="72" class="stage-sub">POST /api/write-feishu</text>
    <text x="24" y="96" class="body">要求脚本已经生成</text>
  </g>

  <g transform="translate(790 845)">
    <rect class="delivery" width="290" height="112"/>
    <circle class="badge-green" cx="32" cy="32" r="16"/>
    <text x="32" y="37" text-anchor="middle" class="label">B</text>
    <text x="60" y="37" class="stage-title">质检并出稿</text>
    <text x="24" y="72" class="stage-sub">run_workflow.py</text>
    <text x="24" y="96" class="body">生成 delivery.md 和风险质检</text>
  </g>

  <g transform="translate(1135 845)">
    <rect class="delivery" width="290" height="112"/>
    <circle class="badge-green" cx="32" cy="32" r="16"/>
    <text x="32" y="37" text-anchor="middle" class="label">C</text>
    <text x="60" y="37" class="stage-title">写入飞书</text>
    <text x="24" y="72" class="stage-sub">feishu/write_doc.py</text>
    <text x="24" y="96" class="body">创建文档，写入 blocks，回写记录</text>
  </g>

  <path class="arrow" d="M245 859 V901 H435"/>
  <text x="302" y="886" class="small">满意</text>
  <path class="arrow" d="M735 901 H780"/>
  <path class="arrow" d="M1080 901 H1125"/>

  <g transform="translate(70 1010)">
    <rect class="note" width="1460" height="66"/>
    <text x="20" y="27" class="stage-sub">补充说明</text>
    <text x="20" y="50" class="small">模型来源：优先 custom_model.txt；没有时使用 Ark 配置。AI 失败时会保存已有素材和兜底结果，后续可从结果页重试。</text>
  </g>
</svg>
